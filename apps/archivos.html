<!doctype html>
<html><head><meta charset="utf-8"><title>Files</title>
<script type="application/json" id="wos-manifest">
{ "id": "files", "name": "Files", "version": "0.2.0",
  "icon": "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M3 6h7l2 2h9v11H3z'/></svg>",
  "category": "system", "description": "Browse, create, move and install from /device",
  "keywords": ["folders", "explorer", "files", "documents"], "permissions": ["fs.read", "fs.write", "fs.delete"],
  "singleton": false, "winWidth": 640, "winHeight": 460 }
</script>
<style>
  body{display:flex;flex-direction:column}
  #crumbs{flex:1;min-width:0;display:flex;gap:2px;overflow:hidden;font:12px var(--mono)}
  #crumbs a{cursor:pointer;padding:2px 5px;white-space:nowrap} #crumbs a:hover{background:var(--ink);color:var(--cell-bg)}
  #list{flex:1;overflow:auto}
  .it{display:flex;gap:12px;align-items:baseline;padding:6px 14px;cursor:default;user-select:none;border-bottom:var(--bw) solid transparent}
  .it:hover{background:var(--panel)} .it.sel{background:var(--ink);color:var(--cell-bg)}
  .it .k{width:4ch;font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;opacity:.55}
  .it .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .it small{font:11px var(--mono);opacity:.6}
  #ask{display:none;gap:8px;padding:8px 10px;border-top:var(--bw) solid var(--ink)} #ask.on{display:flex}
  #ask input{flex:1}
  #empty{padding:30px;font:12px var(--mono)}
  .foot{border-top:var(--bw) solid var(--line);border-bottom:0}
</style></head>
<body>
  <div class="bar">
    <button id="up">Up</button>
    <div id="crumbs"></div>
    <button id="nf">+ Folder</button><button id="nt">+ File</button>
    <button id="up2" title="Import from your computer">Import</button><input id="file" type="file" multiple hidden>
  </div>
  <div id="list"></div>
  <div class="bar foot">
    <button id="open" disabled>Open</button><button id="ren" disabled>Rename</button>
    <button id="inst" disabled title="Register this .html as a cell">Install cell</button>
    <button id="del" class="danger" disabled>Delete</button><span id="msg" class="muted grow" style="text-align:right;font:11px var(--mono)"></span>
  </div>
  <form id="ask"><input id="askin" autocomplete="off"><button class="primary">OK</button><button type="button" id="askx">Cancel</button></form>
<script>
  const $ = id => document.getElementById(id);
  let cwd = '/device', sel = null, items = [];
  const join = (a, b) => (a === '/' ? '' : a) + '/' + b;
  const upOf = p => p.replace(/\/[^/]+$/, '') || '/device';
  const kind = it => it.type === 'dir' ? 'dir' : it.type === 'shortcut' ? 'lnk' : (it.name.split('.').pop().slice(0, 4) || 'file');
  const msg = s => { $('msg').textContent = s || ''; if (s) setTimeout(() => { if ($('msg').textContent === s) $('msg').textContent = ''; }, 3500); };
  const fmt = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';

  async function go(p) {
    cwd = p; sel = null;
    try { items = await Mirage.fs.list(p); } catch (e) { items = []; msg(e.message); }
    render();
    Mirage.cell.setTitle(p === '/device' ? 'Files' : p.split('/').pop());
  }
  function render() {
    const parts = cwd.split('/').filter(Boolean);
    $('crumbs').innerHTML = parts.map((s, i) => `<a data-p="/${parts.slice(0, i + 1).join('/')}">${s}</a>`).join('<span class="muted">/</span>');
    $('list').innerHTML = items.length ? items.map(it =>
      `<div class="it${sel === it.id ? ' sel' : ''}" data-id="${it.id}"><span class="k">${kind(it)}</span><span class="n">${it.name}${it.type === 'dir' ? '/' : ''}</span><small>${it.type === 'dir' ? '' : fmt(it.size)}</small></div>`).join('')
      : '<div id="empty" class="muted">empty folder</div>';
    const cur = items.find(i => i.id === sel);
    $('open').disabled = $('ren').disabled = $('del').disabled = !cur;
    $('inst').disabled = !(cur && /\.html?$/i.test(cur.name));
    $('up').disabled = cwd === '/device';
  }
  const open = async it => { if (it.type === 'dir') go(it.id); else { const r = await Mirage.fs.open(it.id); if (r && r.ok === false) msg('no app for that file type'); } };

  $('list').addEventListener('click', e => { const r = e.target.closest('.it'); sel = r ? r.dataset.id : null; render(); });
  $('list').addEventListener('dblclick', e => { const r = e.target.closest('.it'); if (r) open(items.find(i => i.id === r.dataset.id)); });
  $('crumbs').addEventListener('click', e => { const a = e.target.closest('a'); if (a) go(a.dataset.p); });
  $('up').onclick = () => go(upOf(cwd));
  $('open').onclick = () => open(items.find(i => i.id === sel));

  /* Inline mini-dialog (native prompt() would break the aesthetic) */
  function ask(label, def = '') {
    return new Promise(res => {
      $('ask').classList.add('on'); $('askin').placeholder = label; $('askin').value = def; $('askin').focus(); $('askin').select();
      const done = v => { $('ask').classList.remove('on'); $('ask').onsubmit = $('askx').onclick = null; res(v); };
      $('ask').onsubmit = e => { e.preventDefault(); done($('askin').value.trim() || null); };
      $('askx').onclick = () => done(null);
    });
  }
  const guard = f => async (...a) => { try { await f(...a); } catch (e) { msg(e.message); } };
  $('nf').onclick = guard(async () => { const n = await ask('folder name'); if (n) await Mirage.fs.mkdir(join(cwd, n)); });
  $('nt').onclick = guard(async () => { const n = await ask('file name', 'new.txt'); if (n) await Mirage.fs.write(join(cwd, n), ''); });
  $('ren').onclick = guard(async () => {
    const it = items.find(i => i.id === sel); const n = await ask('new name', it.name);
    if (n && n !== it.name) await Mirage.fs.move(it.id, join(cwd, n));
  });
  $('del').onclick = guard(async () => {
    const it = items.find(i => i.id === sel); const n = await ask(`type "delete" to remove ${it.name}`);
    if (n === 'delete') await Mirage.fs.remove(it.id, true);
  });
  $('inst').onclick = guard(async () => { const r = await Mirage.cell.install(sel); msg(`cell installed: ${r.name}`); });
  $('up2').onclick = () => $('file').click();
  $('file').onchange = guard(async () => {
    for (const f of $('file').files) {
      const path = join(cwd, f.name);
      if (/^text\/|json|javascript|xml/.test(f.type) || /\.(txt|md|js|json|html?|css|csv|log)$/i.test(f.name)) await Mirage.fs.write(path, await f.text());
      else await Mirage.fs.writeBinary(path, await f.arrayBuffer(), f.type || 'application/octet-stream');
    }
    $('file').value = ''; msg('imported');
  });

  const refresh = ev => { const p = ev && (ev.path || ev.dst || ev.src); if (!p || p.startsWith(cwd + '/') || p === cwd) go(cwd); };
  Mirage.ready.then(info => {
    go(info.args.startPath && info.args.startPath.startsWith('/device') ? info.args.startPath : '/device');
    for (const t of ['k:fs:write', 'k:fs:remove', 'k:fs:mkdir', 'k:fs:move']) Mirage.on(t, refresh);
  });
  Mirage.on('args', a => { if (a && a.startPath) go(a.startPath); });
</script></body></html>
