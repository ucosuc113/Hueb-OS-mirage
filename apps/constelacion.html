<!doctype html>
<html><head><meta charset="utf-8"><title>Constellation</title>
<script type="application/json" id="wos-manifest">
{ "id": "constellation", "name": "Constellation", "version": "0.2.0",
  "icon": "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='6' cy='7' r='2'/><circle cx='18' cy='6' r='2'/><circle cx='12' cy='17' r='2'/><path d='M8 7.4l8-1M7 9l4 6M17 8l-4 7'/></svg>",
  "category": "system", "description": "A map of cells, threads, files and time, plus the process and module list",
  "keywords": ["map", "graph", "constellation", "processes", "tasks", "manager", "task manager", "modules", "kill"], "permissions": ["proc.kill", "system.config", "fs.read"],
  "singleton": true, "winWidth": 760, "winHeight": 520 }
</script>
<style>
    body{display:flex;flex-direction:column;overflow:hidden}
  .label{margin:16px 0 8px} .label:first-child{margin-top:0}
  .p{display:flex;align-items:center;gap:10px;padding:5px 8px} .p:hover{background:var(--panel)}
  .p .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tree{border-left:var(--bw) solid var(--line);margin-left:12px;padding-left:6px}
  .pid{color:var(--ink2);font:11px var(--mono);min-width:4ch;font-variant-numeric:tabular-nums}
  button{padding:1px 9px;font-size:12px}
  .k{font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);min-width:11ch}
  #list{flex:1;min-height:0;overflow:auto;padding:14px 16px 22px}
  #list[hidden],#mapbox[hidden]{display:none}
  .tabs{display:flex;align-items:center;flex:none;border-bottom:var(--bw) solid var(--line)}
  .tabs button{border:0;padding:9px 16px;font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
  .tabs button.on{background:var(--ink);color:var(--cell-bg)}
  #mapinfo{padding:0 12px;font:11px var(--mono)}
  #mapbox{position:relative;flex:1;min-height:0;overflow:hidden}
  #map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #map.dragging{cursor:grabbing}
  #tip{position:absolute;pointer-events:none;max-width:280px;padding:6px 8px;background:var(--panel-solid);border:var(--bw) solid var(--ink);font:11px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all}
  #tip[hidden]{display:none}
  #mapbar{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
  #mapbar button{padding:2px 10px;font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--cell-bg)}
</style></head>
<body>
  <div class="label">Processes · thread tree</div><div id="procs"></div>
  <div class="tabs"><button id="tm" class="on">Map</button><button id="tl">List</button><span class="grow"></span><span id="mapinfo" class="muted"></span></div>
  <div id="mapbox">
    <canvas id="map"></canvas><div id="tip" hidden></div>
    <div id="mapbar"><button id="bs">Services</button><button id="bf" class="on">Files</button><button id="bfit">Fit</button></div>
  </div>
  <div id="list" hidden>
    <div class="label">Processes · thread tree</div><div id="procs"></div>
    <div class="label">Shell modules · protected Kernel processes</div><div id="mods"></div>
  </div>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const age = t => { const s = (Date.now() - t) / 1000 | 0; return s < 60 ? s + 's' : s < 3600 ? (s / 60 | 0) + 'm' : (s / 3600 | 0) + 'h'; };

  function node(p, byId) {
    const kids = p.children.map(id => byId[id]).filter(Boolean);
    return `<div class="p"><span class="pid">${p.pid}</span><span class="n">${esc(p.title)}${p.window ? '' : ' <span class="muted">· service</span>'}</span>
      <span class="muted" style="font:11px var(--mono)">${age(p.spawnedAt)}</span>${p.protected ? '<span class="tag">protected</span>' : `<button class="danger" data-kill="${p.pid}">Close</button>`}</div>` +
      (kids.length ? `<div class="tree">${kids.map(k => node(k, byId)).join('')}</div>` : '');
  }
  async function render() {
    const procs = await Mirage.sys.procs();
    const byId = Object.fromEntries(procs.map(p => [p.pid, p]));
    const roots = procs.filter(p => p.parentPid === null && !p.protected);
    $('procs').innerHTML = roots.length ? roots.map(p => node(p, byId)).join('') : '<div class="muted" style="padding:8px;font:12px var(--mono)">no cell is open</div>';
    const mods = await Mirage.sys.modules();
    $('mods').innerHTML = mods.map(m => `<div class="p"><span class="k">${m.kind}</span><span class="n">${esc(m.name || m.id)}</span><span class="pid">pid ${m.pid}</span><button data-restart="${esc(m.path)}">Restart</button></div>`).join('');
  }
  document.addEventListener('click', async e => {
    const k = e.target.closest('[data-kill]'), r = e.target.closest('[data-restart]');
    if (!k && !r) return;
    try {
      if (k) await Mirage.sys.kill(+k.dataset.kill);
      else if (r) { r.textContent = '…'; await Mirage.sys.restartModule(r.dataset.restart); }
    } catch (err) { alert(err.message); }
    render();
  });
  Mirage.ready.then(() => { render(); for (const t of ['k:procs:spawn', 'k:procs:kill', 'k:modules:started', 'k:modules:stopped']) Mirage.on(t, render); setInterval(render, 4000); });
</script>
<script src="constelacion-mapa.js?v=1"></script>
</body></html>
