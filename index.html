<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirage</title>
<link rel="stylesheet" href="mirage/fabric.css">
</head>
<body>
<!-- MIRAGE · L0 · IGNITION
     Este archivo ES el bootloader de Mirage: no depende de ningún repositorio raíz, de service
     workers ni de un instalador. Solo necesita servir esta carpeta tal cual. Es la única página del
     sistema (nunca navega); define las capas fijas y deja que ignition.js cargue el Kernel. -->
<div id="mirage-root">
  <div id="world"><div id="plane"></div></div>   <!-- lentes: celdas -->
  <div id="chrome"></div>                          <!-- pulso, bolsillo -->
  <div id="overlay"></div>                         <!-- deseo, pactos, avisos -->
  <div id="splash">
    <div class="sp-name">Mirage</div>
    <div class="sp-bar"><i id="sp-fill"></i></div>
    <div class="sp-step" id="sp-step">iniciando</div>
    <div class="sp-hint">mantén Shift o F8 para modo seguro</div>
  </div>
</div>
<script src="mirage/substrate.js"></script>
<script src="mirage/cells.js"></script>
<script src="mirage/ignition.js"></script>
</body>
</html>
