<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirage</title>
<link rel="stylesheet" href="mirage/fabric.css">
</head>
<body>
<!-- MIRAGE · L0 · IGNITION
     This file IS Mirage's bootloader: it does not depend on any root repository, service
     workers or an installer. It only needs this folder to be served as is. It is the only page of the
     system (it never navigates); it defines the fixed layers and lets ignition.js load the Kernel. -->
<div id="mirage-root">
  <div id="world"><div id="plane"></div></div>   <!-- lenses: cells -->
  <div id="chrome"></div>                          <!-- pulse, pocket -->
  <div id="overlay"></div>                         <!-- wish, covenants, alerts -->
  <div id="splash">
    <div class="sp-name">Mirage</div>
    <div class="sp-bar"><i id="sp-fill"></i></div>
    <div class="sp-step" id="sp-step">starting</div>
    <div class="sp-hint">hold Shift or F8 for safe mode</div>
  </div>
</div>
<script src="mirage/substrate.js"></script>
<script src="mirage/cells.js"></script>
<script src="mirage/ignition.js"></script>
</body>
</html>
