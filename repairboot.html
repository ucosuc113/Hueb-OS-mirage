<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirage · Reparación</title>
<style>
  *{box-sizing:border-box;border-radius:0}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
  main{width:min(480px,92vw);padding:24px;border:2px solid #fff}
  h1{margin:0 0 12px;font:600 12px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase}
  p{margin:6px 0;color:rgba(255,255,255,.6)} code{color:#fff}
  button{margin:14px 8px 0 0;padding:7px 14px;border:2px solid #fff;background:transparent;color:#fff;cursor:pointer;font:inherit}
  button:hover,button.p{background:#fff;color:#000}
</style></head><body>
<main>
  <h1>Mirage · reparación</h1>
  <p id="why">El Kernel detuvo el arranque.</p>
  <button class="p" id="retry">Reintentar</button><button id="safe">Modo seguro</button>
</main>
<script>
  try {
    var f = JSON.parse(sessionStorage.getItem('huebos_boot_failure') || 'null');
    if (f) document.getElementById('why').innerHTML = 'Motivo: <code>' + f.reason + '</code>' + (f.message ? ' — ' + f.message : '');
  } catch (e) {}
  document.getElementById('retry').onclick = function () { sessionStorage.removeItem('huebos_boot_failure'); location.href = 'index.html'; };
  document.getElementById('safe').onclick = function () { sessionStorage.setItem('huebos_safe_mode', '1'); location.href = 'index.html'; };
</script>
</body></html>
